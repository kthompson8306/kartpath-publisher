kind = "web"
previewPath = "/"
title = "Life Around Senoia"
description = "A publication website and editorial foundation for Life Around Senoia, the first publication powered by the KartPath digital publishing engine."
version = "1.0.0"
id = "artifacts/kartpath-las"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23775

[services.development]
run = "pnpm --filter @workspace/kartpath-las run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kartpath-las", "run", "build" ]

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/kartpath-las/dist/server.mjs" ]

[services.production.run.env]
PORT = "8080"
BASE_PATH = "/"

[services.env]
PORT = "23775"
BASE_PATH = "/"
