openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: publications
    description: Publication bootstrap and theme operations
  - name: auth
    description: Authenticated staff identity and access
  - name: storage
    description: Media upload preparation
  - name: editorial
    description: Publication-scoped editorial content management
  - name: staff
    description: Staff member and invite management for publication admins
  - name: engagement
    description: Public reader engagement — newsletter subscriptions and story nominations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /publications/{slug}:
    get:
      operationId: getPublicationBySlug
      tags: [publications]
      summary: Get a publication's public configuration
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publication configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "404":
          description: Publication not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publications/{slug}/content-items:
    get:
      operationId: listPublishedContentItems
      tags: [publications]
      summary: List published content for a public publication
      description: Returns only published editorial content belonging to the publication identified by the slug. This endpoint is intentionally unauthenticated for public publication pages.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: contentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EditorialContentType"
      responses:
        "200":
          description: Published content items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItemList"
        "404":
          description: Publication not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated staff user and access
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current staff identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/uploads/request-url:
    post:
      operationId: requestStorageUploadUrl
      tags: [storage]
      summary: Request a presigned object upload URL
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadInput"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUpload"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/uploads/{mediaId}/complete:
    post:
      operationId: completeMediaUpload
      tags: [storage]
      summary: Mark an uploaded media asset as ready
      description: Call after a successful PUT to the presigned URL to transition the media asset from pending to ready, enabling it to be attached to content items.
      security:
        - clerkSession: []
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Media asset marked ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          description: No access to this media asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Media asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /editorial/content-items:
    get:
      operationId: listContentItems
      tags: [editorial]
      summary: List publication content items
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/PublicationIdQuery"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EditorialStatus"
        - name: contentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EditorialContentType"
      responses:
        "200":
          description: Content items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItemList"
        "403":
          description: Publication access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createContentItem
      tags: [editorial]
      summary: Create a draft content item
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentItem"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Publication access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /editorial/content-items/{id}:
    get:
      operationId: getContentItem
      tags: [editorial]
      summary: Get a publication content item
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ContentItemIdPath"
        - $ref: "#/components/parameters/PublicationIdQuery"
      responses:
        "200":
          description: Content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "403":
          description: Publication access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateContentItem
      tags: [editorial]
      summary: Update a publication content item
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ContentItemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentItem"
      responses:
        "200":
          description: Updated content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "403":
          description: Publication access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteContentItem
      tags: [editorial]
      summary: Delete a publication content item
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ContentItemIdPath"
        - $ref: "#/components/parameters/PublicationIdQuery"
      responses:
        "204":
          description: Content item deleted
        "403":
          description: Publication access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /editorial/content-items/{id}/publish:
    post:
      operationId: publishContentItem
      tags: [editorial]
      summary: Publish or unpublish a content item
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ContentItemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentItem"
      responses:
        "200":
          description: Updated publication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "403":
          description: Publication access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/members:
    get:
      operationId: listStaffRoster
      tags: [staff]
      summary: List staff members and pending invites for a publication
      parameters:
        - name: publicationId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff roster with members and pending invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRoster"
        "400":
          description: Missing publicationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/invites:
    post:
      operationId: createStaffInvite
      tags: [staff]
      summary: Invite a staff member by email or grant access immediately if they have a Clerk account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffInviteBody"
      responses:
        "200":
          description: Invite created or access granted directly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStaffInviteResponse"
        "400":
          description: Invalid request or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/members/{userId}:
    delete:
      operationId: revokeStaffAccess
      tags: [staff]
      summary: Remove a staff member's access to a publication
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: publicationId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                required:
                  - revoked
        "400":
          description: Cannot remove yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/invites/{inviteId}:
    delete:
      operationId: cancelStaffInvite
      tags: [staff]
      summary: Cancel a pending staff invite
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
        - name: publicationId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                required:
                  - cancelled
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invite not found or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publications/{slug}/subscribe:
    post:
      operationId: subscribeToPublication
      tags: [engagement]
      summary: Subscribe an email address to a publication's newsletter
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "200":
          description: Subscribed successfully (idempotent — already-subscribed emails also return 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Publication not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publications/{slug}/nominations:
    post:
      operationId: submitNomination
      tags: [engagement]
      summary: Submit a community story nomination to a publication
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitNominationInput"
      responses:
        "200":
          description: Nomination received and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitNominationResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Publication not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nominations:
    get:
      operationId: listNominations
      tags: [engagement]
      summary: List story nominations for a publication (staff only)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/PublicationIdQuery"
      responses:
        "200":
          description: Nominations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NominationList"
        "400":
          description: publicationId is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No staff access to this publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    PublicationIdQuery:
      name: publicationId
      in: query
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    ContentItemIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Publication:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        shortName:
          type: string
        description:
          type: string
        domain:
          type: ["string", "null"]
        timezone:
          type: string
        locale:
          type: string
        logoMediaId:
          type: ["string", "null"]
        faviconMediaId:
          type: ["string", "null"]
        settings:
          $ref: "#/components/schemas/PublicationSettings"
      required:
        - id
        - slug
        - name
        - shortName
        - description
        - domain
        - timezone
        - locale
        - logoMediaId
        - faviconMediaId
        - settings
    PublicationSettings:
      type: object
      properties:
        themeTokens:
          type: object
          additionalProperties: true
        navigationItems:
          type: array
          items:
            type: object
            additionalProperties: true
        enabledContentTypes:
          type: array
          items:
            type: string
        defaultSeoTitle:
          type: string
        defaultMetaDescription:
          type: string
        socialLinks:
          type: object
          additionalProperties:
            type: string
        contactEmail:
          type: ["string", "null"]
      required:
        - themeTokens
        - navigationItems
        - enabledContentTypes
        - defaultSeoTitle
        - defaultMetaDescription
        - socialLinks
        - contactEmail
    UserPublicationAccess:
      type: object
      properties:
        publicationId:
          type: string
        publicationSlug:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - publicationId
        - publicationSlug
        - role
        - permissions
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        authProviderSubject:
          type: string
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
        access:
          type: array
          items:
            $ref: "#/components/schemas/UserPublicationAccess"
      required:
        - id
        - authProviderSubject
        - email
        - displayName
        - status
        - access
    StorageUploadInput:
      type: object
      properties:
        publicationId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required:
        - publicationId
        - name
        - size
        - contentType
    StorageUpload:
      type: object
      properties:
        mediaId:
          type: string
        uploadURL:
          type: string
        objectPath:
          type: string
        expiresInSeconds:
          type: number
      required:
        - mediaId
        - uploadURL
        - objectPath
        - expiresInSeconds
    MediaAsset:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        objectPath:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        coverUrl:
          type: ["string", "null"]
      required:
        - id
        - status
        - objectPath
        - originalName
        - mimeType
        - coverUrl
    EditorialContentType:
      type: string
      enum:
        - featured-family
        - nonprofit-spotlight
        - young-achiever
        - pet-of-the-month
        - business-listing
        - event
        - crooks-corner
        - recipe
        - lifestyle-column
    EditorialStatus:
      type: string
      enum:
        - draft
        - published
    ContentItem:
      type: object
      properties:
        id:
          type: string
        publicationId:
          type: string
        contentType:
          $ref: "#/components/schemas/EditorialContentType"
        status:
          $ref: "#/components/schemas/EditorialStatus"
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        coverMediaId:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        updatedBy:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - publicationId
        - contentType
        - status
        - slug
        - title
        - summary
        - body
        - details
        - coverMediaId
        - coverUrl
        - createdBy
        - updatedBy
        - publishedAt
        - createdAt
        - updatedAt
    ContentItemList:
      type: array
      items:
        $ref: "#/components/schemas/ContentItem"
    CreateContentItem:
      type: object
      properties:
        publicationId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        contentType:
          $ref: "#/components/schemas/EditorialContentType"
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties:
            type: string
        coverMediaId:
          type: ["string", "null"]
      required:
        - publicationId
        - contentType
        - slug
        - title
        - summary
        - body
        - details
        - coverMediaId
    UpdateContentItem:
      allOf:
        - $ref: "#/components/schemas/CreateContentItem"
    PublishContentItem:
      type: object
      properties:
        publicationId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        status:
          $ref: "#/components/schemas/EditorialStatus"
      required:
        - publicationId
        - status
    StaffMember:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        grantedAt:
          type: string
          format: date-time
      required:
        - userId
        - email
        - displayName
        - role
        - permissions
        - grantedAt
    StaffInviteRecord:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        invitedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - status
        - invitedAt
    StaffRoster:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/StaffInviteRecord"
      required:
        - members
        - invites
    CreateStaffInviteBody:
      type: object
      properties:
        publicationId:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - publication-admin
            - editor
      required:
        - publicationId
        - email
        - role
    CreateStaffInviteResponse:
      type: object
      properties:
        result:
          type: string
          enum:
            - granted
            - invited
        member:
          $ref: "#/components/schemas/StaffMember"
        invite:
          $ref: "#/components/schemas/StaffInviteRecord"
      required:
        - result
    SubscribeInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
      required:
        - email
    SubscribeResponse:
      type: object
      properties:
        subscribed:
          type: boolean
      required:
        - subscribed
    SubmitNominationInput:
      type: object
      properties:
        nominatorName:
          type: string
          minLength: 1
        nominatorEmail:
          type: string
          minLength: 3
        category:
          type: string
          minLength: 1
        story:
          type: string
          minLength: 1
      required:
        - nominatorName
        - nominatorEmail
        - category
        - story
    SubmitNominationResponse:
      type: object
      properties:
        id:
          type: string
